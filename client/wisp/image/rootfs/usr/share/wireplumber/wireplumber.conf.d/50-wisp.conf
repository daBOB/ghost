# The Veil profile's audio output (scripts/wisp/audio-output.lua): the
# greeter sets wisp.audio-output with `wpctl settings` from the profile.

wireplumber.components = [
  {
    name = wisp/audio-output.lua, type = script/lua
    provides = hooks.device.profile.wisp-audio-output
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.profile.wisp-audio-output = required
  }
}

wireplumber.settings.schema = {
  wisp.audio-output = {
    name = "Audio output"
    description = "display (HDMI/DisplayPort, kept while it sleeps), builtin, or auto"
    type = "string"
    default = "display"
  }
}
