# /run/ghost holds every ghost socket (docs/reference/files-and-paths.md).
# Root's, with the sticky bit, group ghost: ghostd creates its own sockets
# here but can't unlink root's (ghostseat's seat and control sockets, the
# spent-ticket directory), each session user reaches their own control
# socket, and nobody but root and ghost lists it. Made here, not by a
# RuntimeDirectory= on ghostd.service, so it is root's and outlives a
# ghostd restart with the sessions' sockets in it.
d /run/ghost 1771 root ghost -

# pcscd's own directory, which every pcscd creates as it starts and dies
# without: the per-session pcscd wraith runs as the user
# (host/wraith/src/session/pcscd.hpp) can't make it in /run, and it only
# exists where the system's pcscd has run. Root's, so a session's pcscd
# can't touch the system pcscd's socket or pid file in it.
d /run/pcscd 0755 root root -
